services:
  - type: web
    name: clause-guard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: OLLAMA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
