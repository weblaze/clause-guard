services:
  - type: web
    name: clause-guard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_CONCURRENCY
        value: "4"
      - key: CLAUSE_TIMEOUT_SECONDS
        value: "20"
      - key: HYBRID_RETRIEVE_K
        value: "15"
      - key: RERANK_TOP_K
        value: "4"
      - key: RERANK_ENABLED
        value: "true"
      - key: RERANK_MODEL
        value: Xenova/ms-marco-MiniLM-L-6-v2
      - key: DATABASE_URL
        sync: false
